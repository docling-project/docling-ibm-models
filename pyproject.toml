[project]
name = "docling-ibm-models"
version = "4.0.3" # DO NOT EDIT, updated automatically
description = "This package contains the AI models used by the Docling PDF conversion package"
license = "MIT"
keywords = ["docling", "convert", "document", "pdf", "table structure", "table former"]
readme = "README.md"
authors = [
  { name = "Nikos Livathinos", email = "nli@zurich.ibm.com" },
  { name = "Maxim Lysak", email = "mly@zurich.ibm.com" },
  { name = "Ahmed Nassar", email = "ahn@zurich.ibm.com" },
  { name = "Christoph Auer", email = "cau@zurich.ibm.com" },
  { name = "Michele Dolfi", email = "dol@zurich.ibm.com" },
  { name = "Peter Staar", email = "taa@zurich.ibm.com" },
]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = '>=3.10,<4.0'
dependencies = [
  'torch (>=2.2.2,<3.0.0)',
  'torchvision (>=0,<1)',
  'Pillow (>=10.0.0,<13.0.0)',
  'huggingface_hub (>=0.23,<2)',
  'safetensors[torch] (>=0.4.3,<1)',
  'transformers (>=4.42.0,<6.0.0)',
  'numpy (>=1.24.4,<3.0.0)',
]

[project.optional-dependencies]
opencv-python-headless = ['opencv-python-headless (>=4.6.0.66,<5.0.0.0)']
opencv-python = ['opencv-python (>=4.6.0.66,<5.0.0.0)']

[project.urls]
homepage = "https://github.com/docling-project/docling-ibm-models"
repository = "https://github.com/docling-project/docling-ibm-models"
issues = "https://github.com/docling-project/docling-ibm-models/issues"
changelog = "https://github.com/docling-project/docling-ibm-models/blob/main/CHANGELOG.md"

[dependency-groups]
typecheck = [
    "ty==0.0.33",
    "types-setuptools~=70.3",
]
pr-fast-checks = [
    { include-group = "typecheck" },
    "ruff==0.16.10",
]
dev = [
    { include-group = "typecheck" },
    "opencv-python-headless (>=4.6.0.66,<5.0.0.0)",
    "prek>=0.3.10",
    "ruff==0.16.10",
    "coverage~=7.6",
    "pytest~=8.3",
    "pytest-cov>=6.1.1",
    "pytest-dependency~=0.6",
    "pytest-xdist~=3.3",
    "python-semantic-release~=7.32",
]

[tool.uv]
package = true
conflicts = [
    [
        { extra = "opencv-python-headless" },
        { extra = "opencv-python" },
    ]
]

[tool.setuptools.packages.find]
include = ["docling_ibm_models*"]

[tool.ruff]
target-version = "py310"
line-length = 88
respect-gitignore = true

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Keep the scope of the previous black + isort setup: ruff format replaces
# black, and the isort rules replace isort (profile "black").
select = [
  "I", # isort
]

[tool.ruff.lint.isort]
known-first-party = ["docling_ibm_models"]

[tool.semantic_release]
# for default values check:
# https://github.com/python-semantic-release/python-semantic-release/blob/v7.32.2/semantic_release/defaults.cfg

version_source = "tag_only"
branch = "main"

# configure types which should trigger minor and patch version bumps respectively
# (note that they must be a subset of the configured allowed types):
parser_angular_allowed_types = "build,chore,ci,docs,feat,fix,perf,style,refactor,test"
parser_angular_minor_types = "feat"
parser_angular_patch_types = "fix,perf"


[tool.ty.rules]
all = "warn"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["docling_ibm_models", ".github/scripts"]

[tool.ty.analysis]
allowed-unresolved-imports = [
  "torchvision.**",
  "transformers.**",
]

[tool.ty.terminal]
output-format = "concise"
